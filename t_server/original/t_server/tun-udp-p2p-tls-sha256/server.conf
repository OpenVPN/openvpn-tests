######################################################
# UDP, TLS, P2P mode, SHA256
######################################################
#
port 51201
dev tun11
tls-server
proto udp6

# Any X509 key management system can be used.
# OpenVPN can also use a PKCS #12 formatted key file
# (see "pkcs12" directive in man page).
ca /root/openvpn-test-server/keys/ca.crt
cert /root/openvpn-test-server/keys/server.crt
key /root/openvpn-test-server/keys/server.key
dh /root/openvpn-test-server/keys/dh.pem

topology subnet
ifconfig 10.204.11.1 255.255.255.0
ifconfig-ipv6 fd00:abcd:204:11::1/64 fd00:abcd:204:11::2

# gert, 19.12.22, mit ping/ping-restart gab es nur auf DCO Probleme
# (weil "ping in Kernel" nicht getan hat) -> Test ohne ping, mit 11t
#ping 10
#ping-restart 30
ping-timer-rem
server-poll-timeout 3600
reneg-sec 300

push "route 10.204.0.0 255.255.0.0"
push "route-ipv6 fd00:abcd:204::/48"
verb 4

# for 2.6 ("p2p NCP")
#data-ciphers-fallback BF-CBC
data-ciphers BF-CBC:AES-256-GCM:AES-128-GCM

# OpenSSL 1.1 / 3.0 mapping (SHA2-256 <-> SHA256)
auth SHA256

# COMPAT: gert, 22.12.21, OpenSSL 3.0.0 / sha1 & BF-CBC 
tls-cert-profile insecure
providers legacy default
