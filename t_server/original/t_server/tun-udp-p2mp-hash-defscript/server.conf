port 51200
proto udp6
dev tun

# *NO CA* -> master test instance with fingerprint
#ca /root/openvpn-test-server/keys/ca.crt
cert /root/openvpn-test-server/keys/server.crt
key /root/openvpn-test-server/keys/server.key
dh /root/openvpn-test-server/keys/dh.pem

# Configure server mode and supply a VPN subnet
# for OpenVPN to draw client addresses from.
# The server will take 10.8.0.1 for itself,
# the rest will be made available to clients.
# Each client will be able to reach the server
# on 10.8.0.1. Comment this line out if you are
# ethernet bridging. See the man page for more info.
server 10.204.10.0 255.255.255.0
server-ipv6 fd00:abcd:204:10::/64
topology subnet

# Maintain a record of client <-> virtual IP address
# associations in this file.  If OpenVPN goes down or
# is restarted, reconnecting clients can be assigned
# the same virtual IP address from the pool that was
# previously assigned.
ifconfig-pool-persist ipp.txt 60

# Push routes to the client to allow it
# to reach other private subnets behind
# the server.  Remember that these
# private subnets will also need
# to know to route the OpenVPN client
# address pool (10.8.0.0/255.255.255.0)
# back to the OpenVPN server.
push "route 10.204.0.0 255.255.0.0"
push "route-ipv6 fd00:abcd:204::/48"

; gert, 14.09.20, for windows client-to-client test
client-to-client

keepalive 10 30

# Enable compression on the VPN link.
# If you enable it here, you must also
# enable it in the client config file.
comp-lzo

# Output a short status file showing
# current connections, truncated
# and rewritten every minute.
status openvpn-status.log

# Set the appropriate level of log
# file verbosity.
#
# 0 is silent, except for fatal errors
# 4 is reasonable for general usage
# 5 and 6 can help to debug connection problems
# 9 is extremely verbose
verb 4

# auto-switch compression depending on client capabilities
script-security 3
client-connect ../client-connect-switchcomp.sh

cipher BF-CBC        # Blowfish (for 2.2/2.3 client compat)

# allow "non AEAD" GCM ciphers
#  mbedTLS builds have CAMELLIA-256-GCM
#  OpenSSL builds have ARIA-256-GCM
#  -> autoselect?
#data-ciphers CAMELLIA-256-GCM:ARIA-256-GCM:AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305

# Fingerprint auth
config fp.conf

auth-user-pass-verify auth-user-pass-verify.sh via-env

# COMPAT: gert, 13.11.21 compat with 2.2/2.3 clients
tls-version-min 1.0
# COMPAT, gert, 15.11.21, add fallback cipher (2.3 / --enable small, no OCC)
data-ciphers-fallback BF-CBC

# COMPAT: gert, 22.12.21, OpenSSL 3.0.0 / sha1 & BF-CBC 
tls-cert-profile insecure
providers legacy default
